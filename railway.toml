[build]
builder = "NIXPACKS"
buildCommand = "npx prisma generate && npm run build"

[deploy]
startCommand = "npx prisma db push --accept-data-loss --skip-generate && npm start"
healthCheckPath = "/"

[environments.production]
buildCommand = "npx prisma generate && npm run build"
startCommand = "npx prisma db push --accept-data-loss --skip-generate && npm start"

[nixpacks]
node_version = "22"
